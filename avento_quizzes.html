<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avento - Quizzes</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .quiz-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .quiz-btn { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: left; }
    .quiz-btn:hover { background: var(--bg-hover); }
    .quiz-btn.correct { background: #10b981 !important; color: white; }
    .quiz-btn.incorrect { background: #ef4444 !important; color: white; }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">
      <img src="Aventro-removebg-preview.png" alt="Logo" height="30" width="30" onclick="location.href='avento_home.html'" style="cursor:pointer;">
      Avento Quizzes
    </div>
    <div class="nav-links">
      <a href="avento_home.html">Home</a>
      <a href="avento_html_lessons.html">HTML</a>
      <a href="avento_css_lessons.html">CSS</a>
      <a href="avento_js_lessons.html">JavaScript</a>
      <a href="avento_ai_assistant.html" class="ai-nav-btn">✨ AI</a>
      <a href="avento_sandbox_editor.html">Practice</a>
      <a href="avento_quizzes.html" class="active">Quiz</a>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <h3>Assessment</h3>
      <div class="ta">
        <a href="avento_home.html">← Back to Home</a>
        <a href="avento_quizzes.html" class="active">Knowledge Check</a>
      </div>
    </aside>

    <main class="content">
      <h1>Knowledge Check Quiz</h1>
      <p>Test your front-end web development skills[cite: 20].</p>

      <div class="quiz-card">
        <h3>1. Which HTML tag creates the largest heading?[cite: 20]</h3>
        <div class="options-grid">
          <button class="quiz-btn" onclick="evalAnswer(this, false)">&lt;p&gt;</button>
          <button class="quiz-btn" onclick="evalAnswer(this, true)">&lt;h1&gt;</button>
          <button class="quiz-btn" onclick="evalAnswer(this, false)">&lt;head&gt;</button>
          <button class="quiz-btn" onclick="evalAnswer(this, false)">&lt;title&gt;</button>
        </div>
      </div>

      <div class="quiz-card">
        <h3>2. Which CSS property changes text color?[cite: 20]</h3>
        <div class="options-grid">
          <button class="quiz-btn" onclick="evalAnswer(this, false)">font-size</button>
          <button class="quiz-btn" onclick="evalAnswer(this, false)">background</button>
          <button class="quiz-btn" onclick="evalAnswer(this, true)">color</button>
          <button class="quiz-btn" onclick="evalAnswer(this, false)">padding</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function evalAnswer(btn, isCorrect) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.quiz-btn').forEach(b => b.disabled = true);
      btn.classList.add(isCorrect ? 'correct' : 'incorrect');
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
