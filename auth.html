<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aveno - Sign In / Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Aveno_Logo_inverted-removebg-preview.png">
</head>
<body class="auth-page-body">

    <div class="auth-card">
        <div class="auth-header">
            <img src="Aveno_Logo_inverted-removebg-preview.png" alt="Aveno Logo" class="auth-logo">
            <h2 id="authPageTitle">Welcome to Aveno</h2>
            <p id="authPageSub">Sign in to save your multi-turn AI chats & custom profile</p>
        </div>

        <!-- Local Instant Social SSO Buttons -->
        <div class="sso-container">
            <button class="sso-btn google-btn" onclick="handleSocialAuth('Google', 'https://www.svgrepo.com/show/475656/google-color.svg')">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 14.8c0 2.8.7 5.1 1.9 7.5l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
                Continue with Google
            </button>
            <button class="sso-btn ms-btn" onclick="handleSocialAuth('Microsoft', 'https://www.svgrepo.com/show/448239/microsoft.svg')">
                <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
                Continue with Microsoft
            </button>
            <button class="sso-btn apple-btn" onclick="handleSocialAuth('Apple', '')">
                <svg width="18" height="18" viewBox="0 0 170 170" fill="currentColor"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.16-1.9-14.49-6.07-3.26-2.63-7.14-7.23-11.66-13.82-6.53-9.5-11.66-19.98-15.39-31.45-3.73-11.47-5.59-22.37-5.59-32.7 0-14.02 3.69-25.68 11.07-34.98 7.38-9.3 16.79-14 28.23-14.1 4.79 0 9.87 1.15 15.24 3.44 5.37 2.29 9.3 3.44 11.78 3.44 2.12 0 6.07-1.15 11.87-3.44 5.8-2.29 10.68-3.35 14.64-3.18 11.22.69 20.35 4.9 27.39 12.63-10.03 6.05-14.94 14.49-14.73 25.32.22 8.4 3.42 15.54 9.61 21.41 6.18 5.87 13.56 9.17 22.14 9.9-2.3 6.78-5.28 13.43-8.94 19.95zM119.22 31.62c0-7.38 2.65-14.4 7.94-21.07 5.29-6.67 11.96-10.55 20.01-11.64.69 7.6-1.84 14.66-7.59 21.18-5.75 6.52-12.64 10.25-20.36 11.53-.13-.88-.2-1.74-.2-2.58z"/></svg>
                Continue with Apple
            </button>
        </div>

        <div class="auth-divider">
            <span>or with credentials</span>
        </div>

        <!-- Credentials Form (Written 2 times for password confirmation) -->
        <form id="authForm" onsubmit="event.preventDefault(); submitAuthForm();">
            <div class="form-group">
                <label for="authEmail">Email or Username</label>
                <input type="text" id="authEmail" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="authPassword">Password</label>
                <input type="password" id="authPassword" placeholder="••••••••" required>
            </div>

            <!-- Double Password Confirmation for Account Creation -->
            <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                <label for="authPasswordConfirm">Confirm Password (Enter 2nd time)</label>
                <input type="password" id="authPasswordConfirm" placeholder="••••••••">
            </div>

            <button type="submit" id="authSubmitBtn" class="auth-submit-btn">Log In</button>
        </form>

        <div class="auth-footer">
            <span id="authToggleText">Don't have an account?</span>
            <a href="#" id="authToggleLink" onclick="toggleAuthMode(event)">Register now</a>
        </div>
        
        <div style="text-align: center; margin-top: 12px;">
            <a href="index.html" class="guest-link">Continue as Guest</a>
        </div>
    </div>

    <script>
        let isRegistering = false;

        function toggleAuthMode(e) {
            if (e) e.preventDefault();
            isRegistering = !isRegistering;

            const title = document.getElementById("authPageTitle");
            const sub = document.getElementById("authPageSub");
            const submitBtn = document.getElementById("authSubmitBtn");
            const toggleText = document.getElementById("authToggleText");
            const toggleLink = document.getElementById("authToggleLink");
            const confirmGroup = document.getElementById("confirmPasswordGroup");

            if (isRegistering) {
                title.textContent = "Create an Account";
                sub.textContent = "Join Aveno to sync your AI workspace";
                submitBtn.textContent = "Create Account";
                toggleText.textContent = "Already have an account?";
                toggleLink.textContent = "Log In";
                confirmGroup.style.display = "block";
                document.getElementById("authPasswordConfirm").setAttribute("required", "true");
            } else {
                title.textContent = "Welcome to Aveno";
                sub.textContent = "Sign in to save your multi-turn AI chats & custom profile";
                submitBtn.textContent = "Log In";
                toggleText.textContent = "Don't have an account?";
                toggleLink.textContent = "Register now";
                confirmGroup.style.display = "none";
                document.getElementById("authPasswordConfirm").removeAttribute("required");
            }
        }

        function submitAuthForm() {
            const email = document.getElementById("authEmail").value.trim().toLowerCase();
            const password = document.getElementById("authPassword").value.trim();
            const confirmPass = document.getElementById("authPasswordConfirm").value.trim();
            let usersDB = JSON.parse(localStorage.getItem("avenoUsersDB")) || {};

            if (!email || !password) {
                alert("Please fill in all required fields.");
                return;
            }

            if (isRegistering) {
                if (password !== confirmPass) {
                    alert("Passwords do not match! Please make sure you enter the password twice correctly.");
                    return;
                }
                if (usersDB[email]) {
                    alert("An account with this email/username already exists. Please log in.");
                    return;
                }
                const displayName = email.split("@")[0];
                usersDB[email] = {
                    password: password,
                    name: displayName.charAt(0).toUpperCase() + displayName.slice(1),
                    avatar: "",
                    chats: [{ id: Date.now(), title: "New Chat", messages: [] }]
                };
                localStorage.setItem("avenoUsersDB", JSON.stringify(usersDB));
                localStorage.setItem("avenoCurrentUser", email);
                window.location.href = "index.html";
            } else {
                if (!usersDB[email] || usersDB[email].password !== password) {
                    alert("Invalid username/email or password.");
                    return;
                }
                localStorage.setItem("avenoCurrentUser", email);
                window.location.href = "index.html";
            }
        }

        // Instant Local Social Login (No Firebase!)
        function handleSocialAuth(providerName, avatarUrl) {
            const userKey = `${providerName.toLowerCase()}_user@aveno.ai`;
            let usersDB = JSON.parse(localStorage.getItem("avenoUsersDB")) || {};

            if (!usersDB[userKey]) {
                usersDB[userKey] = {
                    password: "local_sso",
                    name: `${providerName} User`,
                    avatar: avatarUrl,
                    chats: [{ id: Date.now(), title: `${providerName} Workspace`, messages: [] }]
                };
                localStorage.setItem("avenoUsersDB", JSON.stringify(usersDB));
            }

            localStorage.setItem("avenoCurrentUser", userKey);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
